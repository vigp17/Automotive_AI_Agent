services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=${MOCK_MODE:-true}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-10-21}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-eastus}
      - AZURE_MAPS_KEY=${AZURE_MAPS_KEY:-}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      - MAPS_BACKEND=${MAPS_BACKEND:-auto}
      - LOCAL_STT=${LOCAL_STT:-true}
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      - CALENDAR_BACKEND=${CALENDAR_BACKEND:-json}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID:-common}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID:-}
      - VEHICLE_BUS=${VEHICLE_BUS:-sim}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      # Keep preferences, conversation memory, and the Outlook token across rebuilds.
      - backend-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
